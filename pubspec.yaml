name: gyeotae
description: "곁애 - 곁에 있다 + 사랑"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^3.3.2

  # 라우팅
  go_router: ^17.5.0

  # 네트워크 (API 서버 통신)
  dio: ^5.11.1

  # 로컬 저장 (토큰 등)
  shared_preferences: ^2.5.5

  # 날짜/숫자 포맷 (flutter_localizations가 0.20.2로 고정)
  intl: ^0.20.2

  # Firebase — 초기화는 `flutterfire configure` 실행 후 활성화 (README 참고)
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0

  # 제보 화면 — 사진 촬영/선택, 위치, 권한
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  permission_handler: 12.0.0

  # 지도 (네이티브 카카오맵) — 네이티브 앱 키를 env의 KAKAO_MAP_KEY로 주입
  kakao_map_sdk: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

  # 텍스트 스타일이 실제로 쓰는 4종만 등록한다. assets/fonts/에 있는 나머지 5종
  # (Thin·ExtraLight·Light·ExtraBold·Black)은 파일은 남아 있지만 번들에는
  # 들어가지 않는다. 쓸 일이 생기면 weight와 함께 위에 추가하면 된다.

  # 에셋을 추가할 때 주석을 풀고 경로를 넣으세요.
  # assets:
  #   - assets/images/
