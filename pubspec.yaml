name: gyeotae
description: "곁애 - 곁에 있다 + 사랑"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^3.3.2

  # 라우팅
  go_router: ^17.5.0

  # 네트워크 (FastAPI 서버 통신)
  dio: ^5.11.1

  # 로컬 저장 (토큰 등)
  shared_preferences: ^2.5.5

  # 날짜/숫자 포맷 (flutter_localizations가 0.20.2로 고정)
  intl: ^0.20.2

  # Firebase — 초기화는 `flutterfire configure` 실행 후 활성화 (README 참고)
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 에셋을 추가할 때 주석을 풀고 경로를 넣으세요.
  # assets:
  #   - assets/images/
